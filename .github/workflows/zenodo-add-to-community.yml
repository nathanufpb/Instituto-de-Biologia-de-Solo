name: Zenodo Add to Community

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'ID do record Zenodo já publicado (ex: 21881749)'
        required: true
        type: string
      community_slug:
        description: 'Slug da community Zenodo (ex: ibs)'
        required: true
        type: string

jobs:
  add-to-community:
    runs-on: ubuntu-latest
    steps:
      - name: Add record to community
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          RECORD_ID="${{ inputs.record_id }}"
          COMMUNITY_SLUG="${{ inputs.community_slug }}"

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://zenodo.org/api/records/${RECORD_ID}/communities" \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"communities\":[{\"id\":\"${COMMUNITY_SLUG}\"}]}")

          echo "HTTP status: ${HTTP_CODE}"
          cat response.json

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Falha ao adicionar record ${RECORD_ID} à community ${COMMUNITY_SLUG}, HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "## Record ${RECORD_ID} adicionado à community '${COMMUNITY_SLUG}'" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat response.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
