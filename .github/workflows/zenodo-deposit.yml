name: Zenodo Deposit

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Nome do projeto (ex: 2026_lima_neotropical_ento)'
        required: true
        type: string
      zenodo_id:
        description: 'ID Zenodo para nova versão de depósito PUBLICADO (vazio = novo depósito)'
        required: false
        type: string
      draft_id:
        description: 'ID de um RASCUNHO (draft) ainda não publicado para atualizar in-place (metadados + arquivo)'
        required: false
        type: string
      publish:
        description: 'Publicar depósito imediatamente?'
        required: true
        type: boolean
        default: false

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve project path
        id: resolve_path
        run: |
          PROJECT="${{ inputs.project }}"
          if [ -d "publications/${PROJECT}" ]; then
            PROJECT_PATH="publications/${PROJECT}"
          elif [ -d "${PROJECT}" ]; then
            PROJECT_PATH="${PROJECT}"
          else
            echo "::error::Diretório não encontrado em 'publications/${PROJECT}' nem na raiz '${PROJECT}'."
            exit 1
          fi
          if [ ! -f "${PROJECT_PATH}/.zenodo.json" ]; then
            echo "::error::Arquivo '${PROJECT_PATH}/.zenodo.json' não encontrado. Crie o arquivo de metadados antes de depositar."
            exit 1
          fi
          echo "project_path=${PROJECT_PATH}" >> "$GITHUB_OUTPUT"
          echo "Caminho resolvido: ${PROJECT_PATH}"

      - name: Create ZIP archive
        run: |
          SAFE_NAME=$(basename "${{ inputs.project }}")
          zip -r "${SAFE_NAME}.zip" "${{ steps.resolve_path.outputs.project_path }}/"
          echo "Arquivo ZIP criado: ${SAFE_NAME}.zip ($(du -sh ${SAFE_NAME}.zip | cut -f1))"

      - name: Create or new-version Zenodo deposit
        id: create_deposit
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          ZENODO_ID="${{ inputs.zenodo_id }}"
          DRAFT_ID="${{ inputs.draft_id }}"
          METADATA_FILE="${{ steps.resolve_path.outputs.project_path }}/.zenodo.json"

          # A API do Zenodo espera os campos aninhados sob a chave "metadata"
          python3 -c "import json; d=json.load(open('${METADATA_FILE}')); json.dump({'metadata': d}, open('payload.json', 'w'))"

          if [ -n "$DRAFT_ID" ]; then
            echo "Atualizando rascunho existente ${DRAFT_ID} (in-place)..."
            UPDATE_CODE=$(curl -s -o update_response.json -w "%{http_code}" -X PUT \
              "https://zenodo.org/api/deposit/depositions/${DRAFT_ID}" \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@payload.json")
            if [ "$UPDATE_CODE" -ge 300 ]; then
              echo "::error::Falha ao atualizar rascunho, HTTP ${UPDATE_CODE}:"
              cat update_response.json
              exit 1
            fi
            DEPOSIT_ID="$DRAFT_ID"
          elif [ -n "$ZENODO_ID" ]; then
            echo "Criando nova versão do depósito ${ZENODO_ID}..."
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "https://zenodo.org/api/deposit/depositions/${ZENODO_ID}/actions/newversion" \
              -H "Authorization: Bearer ${ZENODO_TOKEN}")
            if [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Zenodo API retornou HTTP ${HTTP_CODE}:"
              cat response.json
              exit 1
            fi
            DRAFT_URL=$(python3 -c "import json; print(json.load(open('response.json'))['links']['latest_draft'])")
            DEPOSIT_ID=$(basename "$DRAFT_URL")

            # Atualiza os metadados da nova versão com o conteúdo do .zenodo.json
            UPDATE_CODE=$(curl -s -o update_response.json -w "%{http_code}" -X PUT \
              "https://zenodo.org/api/deposit/depositions/${DEPOSIT_ID}" \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@payload.json")
            if [ "$UPDATE_CODE" -ge 300 ]; then
              echo "::error::Falha ao atualizar metadados, HTTP ${UPDATE_CODE}:"
              cat update_response.json
              exit 1
            fi
          else
            echo "Criando novo depósito..."
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "https://zenodo.org/api/deposit/depositions" \
              -H "Authorization: Bearer ${ZENODO_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@payload.json")
            if [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Zenodo API retornou HTTP ${HTTP_CODE}:"
              cat response.json
              exit 1
            fi
            DEPOSIT_ID=$(python3 -c "import json; print(json.load(open('response.json'))['id'])")
          fi

          echo "deposit_id=${DEPOSIT_ID}" >> "$GITHUB_OUTPUT"
          echo "Depósito ID: ${DEPOSIT_ID}"

      - name: Upload ZIP to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DEPOSIT_ID: ${{ steps.create_deposit.outputs.deposit_id }}
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            "https://zenodo.org/api/deposit/depositions/${DEPOSIT_ID}" \
            -H "Authorization: Bearer ${ZENODO_TOKEN}")
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Zenodo API retornou HTTP ${HTTP_CODE}:"
            cat response.json
            exit 1
          fi
          BUCKET_URL=$(python3 -c "import json; print(json.load(open('response.json'))['links']['bucket'])")

          UPLOAD_CODE=$(curl -s -o upload_response.json -w "%{http_code}" -X PUT \
            "${BUCKET_URL}/$(basename "${{ inputs.project }}").zip" \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            --upload-file "$(basename "${{ inputs.project }}").zip")
          if [ "$UPLOAD_CODE" -ge 300 ]; then
            echo "::error::Falha no upload, HTTP ${UPLOAD_CODE}:"
            cat upload_response.json
            exit 1
          fi

          echo "Arquivo enviado com sucesso ao depósito ${DEPOSIT_ID}."

      - name: Publish deposit
        if: ${{ inputs.publish == true }}
        id: publish
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DEPOSIT_ID: ${{ steps.create_deposit.outputs.deposit_id }}
        run: |
          RESPONSE=$(curl -sf -X POST \
            "https://zenodo.org/api/deposit/depositions/${DEPOSIT_ID}/actions/publish" \
            -H "Authorization: Bearer ${ZENODO_TOKEN}")
          DOI=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['doi'])")
          echo "doi=${DOI}" >> "$GITHUB_OUTPUT"
          echo "Depósito publicado: https://doi.org/${DOI}"

      - name: Job summary
        env:
          DEPOSIT_ID: ${{ steps.create_deposit.outputs.deposit_id }}
          DOI: ${{ steps.publish.outputs.doi }}
        run: |
          echo "## Depósito Zenodo — ${{ inputs.project }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Projeto | \`${{ inputs.project }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deposit ID | ${DEPOSIT_ID} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${DOI}" ]; then
            echo "| DOI | [https://doi.org/${DOI}](https://doi.org/${DOI}) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Status | ✅ Publicado |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Status | 📝 Rascunho (não publicado) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Rascunho | [Visualizar no Zenodo](https://zenodo.org/deposit/${DEPOSIT_ID}) |" >> "$GITHUB_STEP_SUMMARY"
          fi
